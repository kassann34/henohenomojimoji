<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>へのへのもじもじ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: 一画面のゲーム台。上に半紙（盤）、下にパーツを散らす「お膳」、その下に操作ボタン */
:root {
  --kon: #1d2540;        /* 台の紺 */
  --kon-deep: #141a2e;
  --kon-line: #2f3a5e;
  --hanshi: #f5f3ec;     /* 半紙 */
  --sumi: #1b1b1f;       /* 墨 */
  --shu: #c8372d;        /* 朱（判子） */
  --kin: #d9b45a;        /* 金（お正月の差し色） */
  --text: #e9e6dc;
  --muted: #a3a8bd;
  --font-display: "Yuji Syuku", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; }
body {
  background: var(--kon);
  background-image: radial-gradient(circle at 50% 0%, #26305285 0%, transparent 60%);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  font-family: var(--font-display); font-weight: 400;
  font-size: 30px; margin: 0; letter-spacing: .08em; color: var(--hanshi);
}
h1 small { font-size: 13px; color: var(--kin); letter-spacing: .2em; margin-left: 8px; font-family: var(--font-body); }
.status { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

/* 設定 */
.panel { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .label { font-size: 12px; letter-spacing: .12em; color: var(--muted); width: 5.5em; }
.seg { display: inline-flex; border: 1px solid var(--kon-line); border-radius: 999px; overflow: hidden; }
.seg button {
  font: inherit; font-size: 14px; color: var(--muted); background: transparent;
  border: 0; padding: 7px 14px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--hanshi); color: var(--sumi); font-weight: 700; }
/* ゲーム台 */
#stage { position: relative; width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
#board {
  position: absolute; top: 0;
  background: var(--hanshi);
  box-shadow: 0 10px 30px #00000066, inset 0 0 0 1px #00000010;
  border-radius: 2px; overflow: hidden;
}
#board::before { /* 半紙の折り目ガイド（十字） */
  content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(90deg, transparent calc(50% - .5px), #d8d3c4 calc(50% - .5px), #d8d3c4 calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(0deg, transparent calc(50% - .5px), #d8d3c4 calc(50% - .5px), #d8d3c4 calc(50% + .5px), transparent calc(50% + .5px));
  opacity: .7;
}
#board svg.big { position: absolute; inset: 0; width: 100%; height: 100%; }
#board .cover { /* 目隠しの手ぬぐい */
  position: absolute; inset: 0; display: grid; place-items: center;
  background:
    repeating-linear-gradient(45deg, #2a3a6e 0 10px, #24325f 10px 20px);
  color: var(--hanshi); font-family: var(--font-display); font-size: 22px; letter-spacing: .2em;
  transition: transform .9s cubic-bezier(.6,.05,.3,1), opacity .9s;
}
#board .cover.off { transform: translateY(-105%); opacity: .2; pointer-events: none; }
#tray {
  position: absolute; left: 0; right: 0;
  border: 1px dashed var(--kon-line); border-radius: 10px;
  background: #ffffff06;
}
#tray span { position: absolute; left: 10px; top: 6px; font-size: 11px; letter-spacing: .14em; color: var(--muted); }
.piece { position: absolute; cursor: grab; touch-action: none; pointer-events: none; }
.piece svg { width: 100%; height: 100%; overflow: visible; display: block; pointer-events: auto; transition: transform .15s ease-out; }
.piece.offboard svg { transform: scale(.6); } /* おぜんの上では小さく、半紙に乗せると原寸 */
.piece path, svg.big path { fill: none; stroke: var(--sumi); stroke-width: 4.4; stroke-linecap: round; stroke-linejoin: round; }
.piece.onboard path { stroke: var(--sumi); }
.piece.offboard path { stroke: var(--hanshi); }
.piece.dragging { cursor: grabbing; z-index: 50; filter: drop-shadow(0 6px 8px #0008); }
.piece.hiddenplace { opacity: 0; pointer-events: none; }
.piece.reveal { transition: opacity .6s; }
svg.big .ghost path { stroke: var(--shu); stroke-width: 3; opacity: .35; }

/* 判子 */
.stamp {
  position: absolute; right: 6%; bottom: 6%;
  width: 34%; aspect-ratio: 1; max-width: 100%;
  border: 3px solid var(--shu); border-radius: 50%;
  color: var(--shu); display: grid; place-items: center; text-align: center;
  font-family: var(--font-display); line-height: 1.05;
  transform: rotate(-12deg) scale(1); background: #f5f3ecaa;
  animation: stamp .35s cubic-bezier(.2,1.6,.4,1) both;
}
.stamp b { font-weight: 400; display: block; }
@keyframes stamp { from { transform: rotate(-12deg) scale(2.2); opacity: 0; } }

/* お手本の表示 */
.preview {
  position: absolute; inset: 0; display: grid; place-items: center; background: var(--hanshi);
}
.preview .count {
  position: absolute; top: 8px; right: 12px; color: var(--shu); font-family: var(--font-display); font-size: 22px;
}

.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn {
  font: inherit; font-weight: 700; font-size: 15px; letter-spacing: .06em;
  padding: 11px 20px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--kon-line); background: transparent; color: var(--text);
}
.btn.primary { background: var(--shu); border-color: var(--shu); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--kin); outline-offset: 2px; }
.result { text-align: center; display: flex; flex-direction: column; gap: 4px; }
.result .title { font-family: var(--font-display); font-size: 26px; color: var(--hanshi); }
.result .note { color: var(--muted); font-size: 13px; }
.howto { color: var(--muted); font-size: 13px; line-height: 1.8; margin: 0; }
footer { color: #6f7593; font-size: 11px; text-align: center; line-height: 1.6; }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) {
  .stamp { animation: none; }
  #board .cover { transition: none; }
}

/* あそびかた切替・オンライン */
.tabs { display: flex; gap: 6px; }
.tabs button {
  flex: 1; font: inherit; font-weight: 700; font-size: 15px; padding: 10px; cursor: pointer;
  background: transparent; color: var(--muted); border: 0; border-bottom: 2px solid var(--kon-line);
}
.tabs button[aria-pressed="true"] { color: var(--hanshi); border-bottom-color: var(--kin); }
.field { display: flex; gap: 8px; flex-wrap: wrap; }
.field input {
  font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 8px; min-width: 0; flex: 1 1 140px;
  background: var(--kon-deep); color: var(--hanshi); border: 1px solid var(--kon-line);
}
.field input:focus-visible { outline: 2px solid var(--kin); outline-offset: 1px; }
#codeInput { text-transform: uppercase; letter-spacing: .3em; font-variant-numeric: tabular-nums; flex: 0 1 130px; }
.notice { font-size: 13px; color: var(--muted); line-height: 1.7; margin: 0; }
.notice.err { color: #ff9b8f; }
.roomcode { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.roomcode b { font-family: var(--font-display); font-weight: 400; font-size: 28px; letter-spacing: .25em; color: var(--kin); }
.invite { display: flex; gap: 8px; align-items: center; min-width: 0; }
.invite code {
  flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: 12px; color: var(--muted);
  background: var(--kon-deep); border: 1px solid var(--kon-line); border-radius: 6px; padding: 7px 9px;
}
.btn.small { padding: 7px 14px; font-size: 13px; }
.players { display: flex; flex-wrap: wrap; gap: 6px; }
.players span {
  font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--kon-line); color: var(--text);
}
.players span.me { border-color: var(--kin); }
.players span.done::after { content: " ✓"; color: var(--kin); }
.players span.host::before { content: "親 "; color: var(--shu); font-weight: 700; }
.seg button:disabled { cursor: default; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
.gallery figure { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.gallery figcaption { font-size: 12px; display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
.gallery figcaption .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.gallery figcaption .pt { color: var(--kin); flex: none; }
.gallery figure.top .sheet { box-shadow: 0 0 0 3px var(--kin); }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0; color: var(--hanshi); letter-spacing: .1em; }
.waiting { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; color: #8a8576; font-size: 14px; line-height: 1.8; }

/* 四字熟語（書き初めのような縦長の半紙） */
.sheet {
  box-sizing: border-box; background: var(--hanshi); display: flex; flex-direction: column; align-items: stretch;
  padding: 10% 12% 6%; border-radius: 2px; box-shadow: 0 10px 30px #00000066; position: relative;
}
.sheet.big { width: min(62vw, 230px); flex: none; }
.sheet.small { width: 100%; padding: 8% 10% 5%; box-shadow: 0 4px 12px #00000055; }
.sheet .cell svg { width: 100%; aspect-ratio: 1; max-width: 100%; display: block; }
.sheet path { fill: none; stroke: var(--sumi); stroke-width: 4.4; stroke-linecap: round; stroke-linejoin: round; }
.sheet .seal {
  align-self: flex-end; margin-top: 4%; padding: 1px 5px; border: 2px solid var(--shu); border-radius: 3px;
  color: var(--shu); font-family: var(--font-display); font-size: 14px; line-height: 1.2; transform: rotate(-4deg);
  font-variant-numeric: tabular-nums;
}
.sheet.small .seal { font-size: 11px; border-width: 1.5px; }
.yoji { display: flex; gap: 22px; align-items: center; justify-content: center; flex-wrap: wrap; }
.yoji-side { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 0 1 220px; }
.yoji-label { font-size: 11px; letter-spacing: .2em; color: var(--muted); }
.yoji-orig { font-family: var(--font-display); font-size: 34px; letter-spacing: .12em; color: var(--hanshi); line-height: 1.2; }
.yoji-scores { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 12px; font-variant-numeric: tabular-nums; }
.yoji-scores li { display: flex; align-items: baseline; gap: 6px; font-size: 13px; color: var(--muted); }
.yoji-scores li span { font-family: var(--font-display); font-size: 18px; color: var(--hanshi); }
.yoji-scores li b { font-weight: 700; color: var(--text); margin-left: auto; }
.yoji-total { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.yoji-total b { font-family: var(--font-display); font-weight: 400; font-size: 44px; color: var(--kin); line-height: 1; }
.yoji-rank {
  align-self: flex-start; font-family: var(--font-display); font-size: 22px; color: var(--shu);
  border: 2px solid var(--shu); border-radius: 4px; padding: 2px 10px; background: var(--hanshi); transform: rotate(-3deg);
}
.yoji-side .note { color: var(--muted); font-size: 13px; margin: 2px 0 0; line-height: 1.6; }
.gallery { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
</style>

<div class="wrap">
  <header>
    <h1>へのへのもじもじ<small>漢字福笑い</small></h1>
    <div class="status" id="status"></div>
  </header>

  <div class="tabs" id="playTabs">
    <button type="button" id="tab-solo" data-v="solo" aria-pressed="true">ひとりで</button>
    <button type="button" id="tab-online" data-v="online" aria-pressed="false">みんなで</button>
  </div>

  <!-- みんなで：参加前 -->
  <div class="panel" id="joinView" hidden>
    <p class="notice" id="onlineNotice">部屋を作って招待リンクを送ると、同じお題をみんなで同時に解けます。</p>
    <div class="field">
      <input id="nameInput" maxlength="12" placeholder="なまえ" autocomplete="nickname">
    </div>
    <div class="field">
      <button type="button" class="btn primary" id="createBtn">部屋を作る</button>
      <input id="codeInput" maxlength="4" placeholder="コード" autocomplete="off">
      <button type="button" class="btn" id="joinBtn">入る</button>
    </div>
    <p class="notice err" id="joinError" hidden></p>
  </div>

  <!-- みんなで：部屋の中 -->
  <div class="panel" id="roomView" hidden>
    <div class="roomcode"><span class="notice">部屋</span><b id="roomCode"></b><button type="button" class="btn small" id="leaveBtn">退出</button></div>
    <div class="invite"><code id="inviteUrl"></code><button type="button" class="btn small" id="copyBtn">コピー</button></div>
    <div class="players" id="players"></div>
  </div>

  <div class="panel" id="setup">
    <div class="row">
      <span class="label">分け方</span>
      <div class="seg" id="modeSeg">
        <button type="button" id="mode-parts" data-v="parts" aria-pressed="true">パーツごと</button>
        <button type="button" id="mode-strokes" data-v="strokes" aria-pressed="false">一画ずつ</button>
      </div>
    </div>
    <div class="row">
      <span class="label">目隠し</span>
      <div class="seg" id="blindSeg">
        <button type="button" id="blind-on" data-v="on" aria-pressed="true">あり</button>
        <button type="button" id="blind-off" data-v="off" aria-pressed="false">なし（練習）</button>
      </div>
    </div>
  </div>

  <div id="stage">
    <div id="board"></div>
    <div id="tray"><span>おぜん（ここからパーツを運ぶ）</span></div>
  </div>

  <div class="result" id="result" hidden></div>
  <div class="panel" id="yojiPanel" hidden></div>
  <div class="actions" id="actions"></div>

  <div class="panel" id="galleryPanel" hidden>
    <h2>みんなの作品</h2>
    <div class="gallery" id="gallery"></div>
  </div>

  <div class="panel" id="soloPanel">
    <p class="howto">お手本を覚えたら、目隠しをしたつもりで下のおぜんからパーツを半紙へ運びます。置いたパーツは見えなくなります。全部置いたら目隠しをとって、どれだけ元の字に近いか答え合わせ。4字できたら、あなたの字をつなげた「存在しない四字熟語」のできあがりです。</p>
  </div>

  <footer>漢字のデータ：<a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a>（© Ulrich Apel, CC BY-SA 3.0）</footer>
</div>

<script src="kanji-data.js" charset="utf-8"></script>
<script src="firebase-config.js" charset="utf-8"></script>
